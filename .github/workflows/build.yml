name: Build
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Build Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@main
      - name: Setup JDK 21
        uses: actions/setup-java@main
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: |
          cd backend
          chmod +x ./gradlew
      - name: Update Gradle
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          cd backend
          ./gradlew wrapper --gradle-version latest --no-daemon
      - name: Setup Node
        uses: actions/setup-node@main
        with:
          node-version: 24
      - name: Install Node packages
        run: npm ci --prefix frontend
      - name: Update packages
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: npm run update-all --prefix frontend
      - name: Build Angular
        run: npm run build --prefix frontend
      - name: Build JAR
        run: |
          cd backend
          ./gradlew build --no-daemon
      - name: Capture main build artifact
        uses: actions/upload-artifact@main
        with:
          name: Main
          path: backend/build/libs/
      - name: Commit changes
        uses: iarekylew00t/verified-bot-commit@main
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        with:
          message: Update Gradle and Angular
          files: |
            backend/gradle/**
            backend/gradlew
            backend/gradlew.bat
            frontend/package.json
            frontend/package-lock.json
          max-retries: 5
